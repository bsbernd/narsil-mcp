[package]
name = "narsil-mcp"
version = "1.7.0"
edition = "2021"
authors = ["postrv"]
description = "A blazingly fast MCP server for code intelligence - enumerates repos, data structures, algorithms, and returns relevant code context"
license = "MIT OR Apache-2.0"
repository = "https://github.com/postrv/narsil-mcp"
readme = "README.md"
keywords = ["mcp", "code-intelligence", "tree-sitter", "lsp", "ai"]
categories = ["development-tools", "command-line-utilities", "parsing"]
exclude = ["frontend/", "docs/", ".github/", "*.md", "!README.md"]

[features]
default = ["native"]
native = ["dep:notify", "dep:tokio", "dep:async-trait", "dep:reqwest", "dep:lsp-types", "dep:lsp-server", "dep:tempfile", "dep:axum", "dep:tower", "dep:tower-http", "dep:async-stream", "dep:tokio-stream", "dep:redb"]
frontend = ["native", "dep:rust-embed", "dep:mime_guess"]  # Embeds visualization frontend in binary

[dependencies]
# File watching (optional, enabled by default in native)
notify = { version = "6.1", optional = true }

# HTTP client for the stdio proxy and SSE discovery (native only)
# Using rustls-tls instead of native-tls for musl compatibility
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"], optional = true }

# HTTP server for frontend (native only)
axum = { version = "0.7", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
async-stream = { version = "0.3", optional = true }
tokio-stream = { version = "0.1", optional = true }

# Embedded frontend assets (optional, for visualization)
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
# MCP/JSON-RPC
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
tokio = { version = "1.0", features = ["full"], optional = true }
async-trait = { version = "0.1", optional = true }
futures = "0.3"  # FutureExt::catch_unwind for the panic-safe dispatch boundary

# Tree-sitter for parsing
tree-sitter = "0.26"
streaming-iterator = "0.1"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-bash = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-php = "0.23"
tree-sitter-swift = "0.6"
tree-sitter-verilog = "1.0"
tree-sitter-scala = "0.23"
tree-sitter-lua = "0.2"
tree-sitter-haskell = "0.23"
tree-sitter-elixir = "0.3"
tree-sitter-clojure-orchard = "0.2"
tree-sitter-dart-orchard = "0.3"
tree-sitter-julia = "0.23"
tree-sitter-r = "1.2"
tree-sitter-perl = "1.1"
tree-sitter-zig = "1.1"
tree-sitter-erlang = "0.14"
tree-sitter-elm = "5.9"
tree-sitter-fortran = "0.5"
tree-sitter-powershell = "0.25"
tree-sitter-nix = "0.3"
tree-sitter-groovy = "0.1"

# File system and path handling
walkdir = "2.5"
ignore = "0.4"  # Respects .gitignore
glob = "0.3"
# Note: notify is optional and enabled via the "native" feature

# Indexing and search
tantivy = { version = "0.22", default-features = false, features = ["lz4-compression"] }  # Full-text search engine (no mmap for wasm compat)
memmap2 = "0.9"   # Memory-mapped files for speed
postcard = { version = "1.1", default-features = false, features = ["use-std"] }   # Binary serialization for index persistence
redb = { version = "2", optional = true }   # Embedded KV store: per-file index records (native only)
regex = "1.10"    # Regular expression support

# Configuration and rules
serde-saphyr = "0.0"  # YAML parsing for security rules (panic-free, actively maintained)
toml = "0.8"        # TOML parsing for config

# Utilities
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.0", features = ["derive", "env"] }
directories = "5.0"
sha2 = "0.10"
lazy_static = "1.5"
parking_lot = "0.12"
hdrhistogram = { version = "7", default-features = false, features = ["serialization"] }  # Latency percentiles persisted across restarts
fs4 = "0.13"  # Cross-platform advisory file locking for the global stats file
rayon = "1.10"  # Parallel iteration
dashmap = "6.0"  # Concurrent hashmap
uuid = { version = "1.0", features = ["v4"] }  # For generating unique streaming tokens
chrono = "0.4"  # Date/time handling for SBOM generation

tempfile = { version = "3.8", optional = true }

# LSP integration (native only)
lsp-types = { version = "0.95", optional = true }  # LSP protocol types
lsp-server = { version = "0.7", optional = true }  # LSP server utilities

[dev-dependencies]
tempfile = "3"
proptest = "1.4"          # Property-based testing
criterion = { version = "0.5", features = ["html_reports"] }  # Benchmarking
test-case = "3.3"         # Parameterized tests
pretty_assertions = "1.4" # Better assertion diffs

[[bench]]
name = "indexing"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "filtering"
harness = false

[[bench]]
name = "token_usage"
harness = false

[profile.release]
lto = "thin"
codegen-units = 16
# Unwind (not abort) so a panic in one tool handler is caught at the MCP
# dispatch boundary and returned as an error, instead of killing the server.
panic = "unwind"
strip = true

[lib]
name = "narsil_mcp"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "narsil-mcp"
path = "src/main.rs"
